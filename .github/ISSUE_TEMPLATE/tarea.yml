name: Tarea
description: Trabajo a realizar. Su número va en el nombre de la rama (p. ej. feat/42-login).
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      description: Parte del repo que se toca (mismas áreas que .github/labeler.yml).
      options:
        - Apps (apps/)
        - Servicios (services/)
        - DevSecOps (.github, scripts)
        - Docs
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      description: Será el prefijo de la rama y del título del PR.
      options:
        - feat (funcionalidad nueva)
        - fix (corrección)
        - docs
        - refactor
        - perf
        - test
        - build / ci
        - chore / style
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué hay que hacer y para qué.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
